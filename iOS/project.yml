# The Amadare iPhone app. scripts/build-ios.sh generates Amadare.xcodeproj from this with XcodeGen
# (brew install xcodegen); the generated project isn't checked in.
name: Amadare
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  # The repo's Swift package, for AmadareCore.
  Amadare:
    path: ..
targets:
  # Not "Amadare", which is the Mac app's product in the Swift package. The app is still named Amadare.
  AmadareiOS:
    type: application
    platform: iOS
    sources:
      - Amadare
      # Shared with the Mac app.
      - path: ../Sources/Amadare/Theme.swift
      - path: ../Sources/Amadare/RainGlass.swift
    dependencies:
      - package: Amadare
        product: AmadareCore
    info:
      path: Amadare/Info.plist
      properties:
        CFBundleDisplayName: Amadare
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Amadare reaches Anki on your Mac or home server over your network.
        # AnkiConnect speaks plain HTTP, at whatever address you enter in Settings.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.noahjohn1.amadare
        PRODUCT_NAME: Amadare
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
